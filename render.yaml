services:
  - type: web
    name: ubtkdmis-api
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run prisma:generate:postgres && npm run build
    startCommand: npm run prisma:migrate:postgres && npm run seed && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_NAME
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CLIENT_ORIGIN
        value: https://ubtkdmis.github.io,https://knightfalconvj.github.io
      - key: CLIENT_BASE_URL
        value: https://ubtkdmis.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: ubtkdmis-db
          property: connectionString

databases:
  - name: ubtkdmis-db
    plan: free
    databaseName: ubtkdmis
    user: ubtkdmis
