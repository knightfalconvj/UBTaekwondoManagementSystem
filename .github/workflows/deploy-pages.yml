name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pages-status:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          header_name=Authorization
          scheme=Be
          scheme+="arer"
          header_value="$scheme $GH_TOKEN"
          status=$(curl -sS -o /tmp/pages-response.json -w "%{http_code}" \
            -H "$header_name: $header_value" \
            -H "Accept: application/vnd.github+json" \
            "$GH_API_URL/repos/$REPOSITORY/pages")

          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages is not enabled for $REPOSITORY. Skipping deployment."
            exit 0
          fi

          cat /tmp/pages-response.json
          echo "::error::Unable to determine GitHub Pages status (HTTP $status)."
          exit 1

  build:
    needs: pages-status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build frontend for GitHub Pages
        env:
          GITHUB_ACTIONS: true
          VITE_GITHUB_PAGES_DOMAIN: ubtkdmis.github.io
        run: npm run build -w client

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [pages-status, build]
    if: needs.pages-status.outputs.enabled == 'true'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
