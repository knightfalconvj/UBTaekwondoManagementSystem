<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" role="img" aria-labelledby="t d">
  <title id="t">UB Taekwondo Team Icon</title>
  <desc id="d">Circular team crest with UB initials and taekwondo kick arc.</desc>
  <defs>
    <radialGradient id="bg" cx="30%" cy="25%" r="90%">
      <stop offset="0%" stop-color="#1b4fca"/>
