<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      const path = window.location.pathname.replace(/\/+$|\/$/, '');
      const base = path.startsWith('/UBTaekwondoManagementSystem/') ? '/UBTaekwondoManagementSystem/' : '/';
      const redirect = `${base}index.html?redirect=${encodeURIComponent(window.location.pathname + window.location.search)}`;
      window.location.replace(redirect);
    </script>
  </head>
  <body></body>
</html>
